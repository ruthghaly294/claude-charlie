# DECODE — config tuned to your topics.
# Safe to commit (no secrets). API keys live in .env.local.

vault: ~/second-brain

business:
  name: "Signal Desk"
  description: "Finance, congressional/insider trades, trading & risk analysis, web scraping, SaaS/marketing growth, trending GitHub, and radiology."
  # Keywords drive relevance scoring + clustering. Score saturates at 2 matches
  # and is independent of list length, so adding keywords broadens coverage
  # without lowering scores. Empty [] = keep & cluster everything by source.
  keywords:
    - macro
    - 13F
    - insider trading
    - institutional trading
    - order flow
    - congress trades
    - pelosi
    - technical analysis
    - risk management
    - web scraping
    - scraping
    - saas
    - marketing
    - seo
    - radiology
    - trending
  competitors: []

scoring:
  # Scoring saturates at 2 matches (1 match ≈ 0.5), independent of list length,
  # so this threshold is stable: 0.3 keeps anything matching ≥1 keyword.
  keep_threshold: 0.3

observe:
  min_cluster_size: 1   # form insights as soon as a topic appears

decide:
  cluster_lanes: {}

execute:
  top_n: 5

sources:
  # --- no API key required ---
  rss:
    - https://hnrss.org/frontpage
    - https://www.cnbc.com/id/20910258/device/rss/rss.html        # CNBC markets
    - http://feeds.marketwatch.com/marketwatch/topstories/        # MarketWatch
    - https://seekingalpha.com/feed.xml                           # Seeking Alpha
    - https://www.federalreserve.gov/feeds/press_all.xml          # Fed press
    # SEC 13F current filings (Atom). NOTE: SEC requires a User-Agent header;
    # if this 403s, the connector needs a UA set — tell me and I'll add it.
    - "https://www.sec.gov/cgi-bin/browse-edgar?action=getcurrent&type=13F&output=atom"
    - https://www.reddit.com/r/algotrading/.rss
  github_trending:
    topics: [web-scraping, trading, quant, saas, marketing, frontend, backend]
    window: daily
  reddit:
    subreddits:
      - stocks
      - investing
      - wallstreetbets
      - algotrading
      - SecurityAnalysis
      - webscraping
      - SaaS
      - Entrepreneur
      - marketing
      - Radiology
  hackernews:
    query: ""

  # --- API key required (set in .env.local) ---
  youtube:
    queries:
      - stock market technical analysis
      - congress insider trading stocks
      - web scraping tutorial
      - saas marketing growth
      - radiology cases
  twitter:
    enabled: true        # uses TWITTER_BEARER
    # Follow specific handles (all recent tweets), in addition to the keyword
    # search below. Edit freely. (Pelosi has no official trade feed; trackers
    # like unusual_whales / PelosiTracker_ surface congressional trades.)
    accounts:
      - realDonaldTrump
      - unusual_whales
      - PelosiTracker_
      - QuiverQuant
    use_keywords: true   # also run the topic keyword search
  producthunt:
    enabled: true        # uses PRODUCTHUNT_TOKEN
  google_cse:
    enabled: false       # flip true once GOOGLE_CSE_KEY + GOOGLE_CSE_ID are set
