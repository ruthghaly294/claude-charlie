name: Property refresh

# Daily drain of due jobs (discovery, property-scrape, decode, … per
# decode.config.yml's jobs.schedules). The SQLite DB (gitignored for local
# dev) is force-committed so each run builds on the last — the accumulating
# price history lives in git for now.
on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write

concurrency: property-refresh

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Drain due jobs (discovery, property-scrape, decode, …)
        run: npm run jobs:tick
        env:
          DECODE_DB_PATH: data/cc.db

      - name: Commit updated property data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/cc.db
          if git diff --cached --quiet; then
            echo "No property changes today."
          else
            git commit -m "chore(jobs): scheduled tick"
            git push
          fi
