name: Telegram review sync

on:
  schedule:
    # Run once after the 07:00 UTC content-generation window, batching all new
    # Buffer drafts into a single daily Telegram review delivery.
    - cron: "15 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-review-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Send unseen Buffer drafts to Telegram
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_CHANNEL_ID: 6a2c16ff38b55793458ab515
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_REVIEW_CHAT_ID: ${{ secrets.TELEGRAM_REVIEW_CHAT_ID }}
          # A manual run is an explicit delivery test; scheduled runs remain
          # deduplicated and only send genuinely unseen drafts.
          FORCE_LATEST: ${{ github.event_name == 'workflow_dispatch' }}
        run: node render-telegram-bot/sync.mjs
      - name: Persist notification state
        run: |
          if ! git diff --quiet -- .github/telegram-review-state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/telegram-review-state.json
            git commit -m "chore(telegram): advance review notification state [skip ci]"
            git push
          fi
